name: Release

on:
  push:
    branches:
      - main
    paths:
      - deno.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # jsr + npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: version
        run: echo "version=$(jq -r '.version' deno.json)" >> $GITHUB_OUTPUT

      - name: Tag + Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - uses: denoland/setup-deno@v2

      - run: deno publish

      - name: Version schon auf npm?
        id: check
        run: |
          if npm view @nuxodin/item@${{ steps.version.outputs.version }} version >/dev/null 2>&1; then
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm aktualisieren # OIDC braucht npm >= 11.5.1
        if: steps.check.outputs.new == 'true'
        run: npm install -g npm@latest

      - name: Version aus deno.json übernehmen
        if: steps.check.outputs.new == 'true'
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.version.outputs.version }}

      - name: npm publish
        if: steps.check.outputs.new == 'true'
        run: npm publish --access public
