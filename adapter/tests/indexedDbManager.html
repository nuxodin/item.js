<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Test</title>
    <script type=module async src="https://cdn.jsdelivr.net/gh/u2ui/u2@main/u2/auto.js"></script>
    <link rel=stylesheet href="https://cdn.jsdelivr.net/gh/u2ui/u2@main/css/classless/simple.css">
    <style>
        html {
            font-size: 12px;
            --width: 120rem;
        }
    </style>

<body>

<script type=module>

import { effect, item } from '../../item.js';
import { iDB } from "../indexedDb.js";
import * as view from "../../tools/view/uhtml.js";
import { render, html } from "https://esm.sh/uhtml@4";
import { toInput } from "../../tools/schema/render/dom.js";
import { transform } from "../../tools/schema/utils.js";

const schema = {
    properties: {
        group: {
            additionalProperties: {
                properties: {
                    id: { 'x-index': 'primary', 'x-autoincrement': true, title: 'ID' },
                    name: { 'x-index': true, type: 'string', title: 'Name' },
                },
                'x-display': 'name',
            },
        },
        post: {
            additionalProperties: {
                properties: {
                    id: { 'x-index': 'primary', 'x-autoincrement': true, title: 'ID' },
                    title: { type: 'string', title: 'Title', 'x-transform': { case: 'upper' } },
                    content: { type: 'string', title: 'Content', 'x-multiline': true, 'x-transform': { trim: false } },
                    user_id: { 'x-index': true, 'x-dataref': '../../../user/$', title: 'User' },
                    group_id: { 'x-index': true, 'x-dataref': '../../../group/$', title: 'Group' },
                },
                'x-display': 'title',
            },
        },
        user_group: {
            additionalProperties: {
                properties: {
                    user_id: { 'x-index': 'primary', 'x-dataref': '../../../user/$', title: 'User' },
                    group_id: { 'x-index': 'primary', 'x-dataref': '../../../group/$', title: 'Group' },
                    relation: { type: 'string', title: 'Relation' },
                }
            }
        },
        user: {
            additionalProperties: {
                properties: {
                    id: { 'x-index': 'primary', 'x-autoincrement': true, title: 'ID' },
                    firstname: { type: 'string', title: 'Vorname' },
                    lastname: { type: 'string', title: 'Nachname' },
                    email: { 'x-index': 'unique', title: 'E-Mail' },
                    age: { type: 'number', title: 'Alter' },
                },
                'x-display': 'email',
            },
            title: 'Benutzer',
        },

    }
};


let db = iDB.item('db4');
db.setSchema(schema);
db.open();
db.addEventListener('setIn', transform);

await db.read();

import { jsonItem } from "../storage.js";

const ui = (await jsonItem('dbAdminUi')).proxy;

effect(() => {

    const store = db.item(ui.store());
    store.read();

    const fields = store.schema?.additionalProperties?.properties ?? {};
    const cols = Object.entries(fields).filter(([,s]) => {return s.title}).map(([n,s]) => n);

    render(appEl, html`
        Select Store:
        <select onchange="${(e) => { ui.store(e.target.value) }}" style="width:auto">
            ${[...db].map(item => html`<option value="${item.key}" .selected="${item.key === ui.store()}"> ${item.schema?.title ?? item.key}`)}
        </select>

        <hr>

        <h3>
            ${store.schema?.title ?? store.key}
            <button onclick="addUserDialog.showModal()">+</button>
        </h3>
        
        <dialog id=addUserDialog>
            <form onsubmit="${(e) => {
                    e.preventDefault();
                    store.add(Object.fromEntries(new FormData(e.target).entries()));
                }}">
                <table style="width:auto">
                    ${cols.map(name => html`<tr><td> ${name} <td>${toInput(fields[name], {name})}`)}
                </table>
                <button>add</button>
            </form>
        </dialog>                

        ${view.table(store, { editable: true, cols })}
    `);
});

</script>

<h1>indexedDb Manager</h1>
<div id=appEl></div>
