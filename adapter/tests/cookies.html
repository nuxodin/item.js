<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Test</title>
    <script type=module async src="https://cdn.jsdelivr.net/gh/u2ui/u2@main/u2/auto.js"></script>
    <link rel=stylesheet href="https://cdn.jsdelivr.net/gh/u2ui/u2@main/css/classless/simple.css">
<body>

<script type=module>

import { effect } from '../../item.js';
import { cookie } from "../cookie.js";
import { render, html } from "https://esm.sh/uhtml@4";

cookie.read();

effect(() => {
    render(table, html`
        <thead>
            <tr>
                <th> Name
                <th> Value
                <th width=10> <button onclick="${()=>{let name=prompt('cookie name'); if(name)cookie.item(name).value=''}}">add</button>
        <tbody>
            ${[...cookie].map(item => {
                return html`
                    <tr>
                        <td> ${item.key}
                        <td> <input .value="${item.value??''}" oninput=${(e)=>{item.value=e.target.value}}>
                        <td> <button onclick="${()=>item.remove()}" class=u2-unstyle u2-confirm="delete Cookie?">✖</button>
                `;
            })}
    `);
});

</script>


<h1>Cookie Manager</h1>
<table id=table></table>
