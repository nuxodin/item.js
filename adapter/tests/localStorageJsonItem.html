<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Test</title>
<body>

<h1>Test</h1>

<script type=module>

import {effect} from "../item.js";
import {jsonItem} from "../adapter/storage.js";


const track = window.track = (await jsonItem('track')).proxy;
console.log(track)

++track.visits;
track.lastVisit = new Date().toISOString();


++track.sessions;
addEventListener('beforeunload', () => {
    --track.sessions;
});

effect(() => {
    output.innerHTML = JSON.stringify(track(), null, 2);
});

</script>

<small>Open an other window and see the value change.</small><br>

<button onclick="delete track.visits; delete track.lastVisit">clean</button>

<pre id=output></pre>
