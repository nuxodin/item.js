<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>item.js Tests</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css" />
</head>
<body>
    <div id="mocha"></div>
    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>
    <script class="mocha-init">
        // ?grep=proxy runs a subset, like `deno test --filter proxy`
        const grep = new URLSearchParams(location.search).get('grep');
        mocha.setup({ ui: 'bdd', ...(grep && { grep }) });
        mocha.checkLeaks();
    </script>
    <!-- specs are shared with deno: `deno task test` runs the very same files -->
    <script type="module" src="./spec/core.test.js"></script>
    <script type="module" src="./spec/io.test.js"></script>
    <script type="module" src="./spec/proxy.test.js"></script>
    <script type="module" src="./spec/effect.test.js"></script>
    <script type="module" src="./spec/schema.test.js"></script>
    <script class="mocha-exec" type="module">
        mocha.run();
    </script>
</body>
</html>
