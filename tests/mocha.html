import { item, Item, $item } from '../item.js';
import { asyncIteratorFromEventTarget } from '../src/Emitter.js';

describe('primitive value', () => {
    it('access item.value', () => {
        let i = item(22);
        chai.expect(i.value).to.equal(22);
    });
    it('item.filled (value provided in constructor)', () => {
        let i = item();
        chai.expect(i.value).to.equal(undefined);
        chai.expect(i.filled).to.equal(false);
        i.value = 22;
        chai.expect(i.filled).to.equal(true);
    });
    it('toString', () => {
        let i = item(22);
        chai.expect(`${i}`).to.equal('22');
        chai.expect(i + '').to.equal('22');
    });
    it('[Symbol.toPrimitive]', () => {
        let i = item(22);
        chai.expect(i + 0).to.equal(22);
    });
    it('JSON.stringify', () => {
        let i = item(22);
        chai.expect(JSON.stringify(i)).to.equal('22');
    });
    it('.parent is null', () => {
        let i = item(22);
        chai.expect(i.parent).to.equal(null);
    });
    it('.key is null', () => {
        let i = item(22);
        chai.expect(i.key).to.equal(null);
    });
    it('change value', () => {
        let i = item(22);
        i.value = null;
        chai.expect(i.value).to.equal(null);
    });

    it('0 not equals -0', () => {
        let i = item(0);
        let changed = false;
        i.addEventListener('change', e => changed = true);
        i.value = -0;
        chai.expect(changed).to.equal(true);
    });
    it('NaN equals NaN', () => {
        let i = item(NaN);
        let changed = false;
        i.addEventListener('change', e => changed = true);
        i.value = NaN;
        chai.expect(changed).to.equal(false);
    });

});

describe('object value', () => {
    let i = item({ a: 1, b: { b1: 2, b2: 3 } });
    let b = i.item('b');
    let b2 = b.item('b2');

    it('parent of item', () => {
        chai.expect(b2.parent).to.equal(b);
    });
    it('access value should return object', () => {
        chai.expect(b.value).to.deep.equal({ b1: 2, b2: 3 });
    });
    it('as JSON object', () => {
        chai.expect(JSON.stringify(b)).to.equal('{"b1":2,"b2":3}');
    });
    it('access value of nested item', () => {
        chai.expect(b2.value).to.equal(3);
    });
    it('toString of primitive is its value', () => {
        chai.expect(String(b2)).to.equal('3');
    });
    it('toString of object is its key', () => {
        chai.expect(String(b)).to.equal('b');
    });
    it('has("existing") returns the item', () => {
        chai.expect(i.has('b')).to.equal(i.item('b'));
    });
    it('has("no") returns undefined', () => {
        chai.expect(i.has('no')).to.equal(undefined);
    });
    it('has(["existing","no"]) returns undefined', () => {
        chai.expect(i.has(['b','no'])).to.equal(undefined);
    });
    it('has("existing","existing") returns the item', () => {
        chai.expect(i.has('b','b1')?.key).to.equal('b1')
    });
    it('add a new property', () => {
        b.item('c').value = 4;
        chai.expect(b.item('c').value).to.equal(4);
    });
    it('path', () => {
        chai.expect(b2.path).to.deep.equal(['b', 'b2']);
    });
    // it('path as string of item', () => { removed for now
    //     chai.expect(b2.pathString).to.equal('b/b2');
    // });
    it('keys of root', () => {
        chai.expect(i.path).to.deep.equal([]);
    });
    it('sub(array)', () => {
        chai.expect(i.sub(['b', 'b2']).value).to.equal(3);
    });
    it('sub(..arguments)', () => {
        chai.expect(i.sub('b', 'b2').value).to.equal(3);
    });
    it('sub(combined)', () => {
        chai.expect(i.sub(['b'], 'b2').value).to.equal(3);
    });
    it('sub() no argument', () => {
        chai.expect(i.sub()).to.equal(i);
    });
    it('sub([]) void array', () => {
        chai.expect(i.sub([])).to.equal(i);
    });
    it('assigning a object will remove existing properties not in the new object', () => {
        let i = item({ a: 1 });
        i.value = { b: 2 };
        chai.expect(i.value).to.deep.equal({ b: 2 });
    });
    it('assigning a object that was void before', () => {
        let i = item({});
        i.value = { a: 2 };
        chai.expect(i.value).to.deep.equal({ a: 2 });
    });
    it('iterator', () => {
        let i = item({ a: 1, b: 2 });
        const result = [];
        for (let item of i) {
            result.push(item.key);
        }
        chai.expect(result).to.deep.equal(['a', 'b']);
    });
    it('deep set', () => {
        let i = item({ a: 1, b: { b1: 2, b2: { c: 3 } } });
        const value = { a: 1, b: { b2: { c: 4 } } };
        const clone = structuredClone(value);
        i.value = value;
        chai.expect(i.value).to.deep.equal(clone);
        chai.expect(i.item('b').item('b2').item('c').value).to.equal(4);
        chai.expect(i.item('b').has('b1')).to.equal(undefined);
    });
    it('deep patch', () => {
        let i = item({ a: 1, b: { b1: 2, b2: { c: 3 } } });
        const value = { a: 1, b: { b2: { c: 4, d: 5 } } };
        i.patch(value);
        chai.expect(i.value).to.deep.equal({ a: 1, b: { b1: 2, b2: { c: 4, d: 5 } } });
        chai.expect(i.item('b').item('b2').item('d').value).to.equal(5);
        chai.expect(i.item('b').has('b1')).to.not.equal(false);
    });

    it('switching from object to primitive clears children', () => {
        let i = item({a:1});
        let childA = i.item('a');
        i.value = 100;
        chai.expect(i.keys).to.deep.equal([]);
        chai.expect(i.item('a')).to.not.equal(childA);
    });

    it('works with spread operator {...proxy}', () => {
        const p = item({ a: 1, b: 2 }).proxy;
        const items = { ...p };
        chai.expect(Object.keys(items)).to.deep.equal(['a', 'b']);
        chai.expect(items.a[$item]).to.be.ok;
        chai.expect(items.a()).to.equal(1);
    });

    it('works with Object.assign(source, proxy)', () => {
        const raw = item({ a: 1, b: 2 });
        const p = raw.proxy;
        const target = { existing: true };

        Object.assign(target, p);

        // Prüfungen
        chai.expect(target.existing).to.be.true;
        chai.expect(target.a[$item]).to.equal(p.a[$item]);
        chai.expect(target.b[$item]).to.equal(p.b[$item]);
        
        // Sicherstellen, dass die Werte funktional bleiben
        chai.expect(target.a()).to.equal(1);
    });

    it('Object.assign(proxy, source) updates the underlying items', () => {
        const raw = item({ a: 1, c: 3 });
        const p = raw.proxy;
        Object.assign(p, { a: 10, b: 20, c: { c1: 30 } });
        chai.expect(raw.item('a').value).to.equal(10);
        chai.expect(raw.item('b').value).to.equal(20);
        chai.expect(raw.item('c').item('c1').value).to.equal(30);
    });    


});

describe('events', () => {
    it('event.oldValue', done => {
        let i = item(1);
        i.addEventListener('set', e => {
            chai.expect(e.oldValue).to.equal(1);
            done();
        });
        i.value = 2;
    });
    it('event.value', done => {
        let i = item(1);
        i.addEventListener('set', e => {
            chai.expect(e.value).to.equal(2);
            done();
        });
        i.value = 2;
    });
    it('event.target', done => {
        let i = item({a:3});
        i.addEventListener('setIn', e => {
            chai.expect(e.target).to.equal(i.item('a'));
            done();
        });
        i.item('a').value = 4;
    });
    it('change deep property', done => {
        let i = item({ a: 1, b: 2 });
        i.addEventListener('setIn', e => {
            chai.expect(e.target.key).to.equal('a');
            done();
        });
        i.item('a').value = 2;
    });
    it('throw circular set', done => {
        let i = item();
        i.addEventListener('set', e => {
            chai.expect(() => {
                i.value = Math.random()
            }).to.throw('circular set');
            done();
        });
        i.value = 2;
    });
    
    it('event bubbling and order: setIn, changeIn', () => {
        let i = item({ a: 1 });
        let types = '';
        i.addEventListener('setIn', e => types += e.type);
        i.addEventListener('changeIn', e => types += e.type);
        i.item('a').value = 2;
        i.item('a').value;
        chai.expect(types).to.equal('setInchangeIn');
    });

    it('event no bubbling: change, set', () => {
        let i = item({ a: 1 });
        let types = '';
        i.addEventListener('change', e => types += e.type);
        i.addEventListener('set', e => types += e.type);
        i.item('a').value = 2;
        i.item('a').value;
        chai.expect(types).to.equal('');
    }); 

    it('event order change, changeIn', () => {
        let i = item(1);
        let types = '';
        i.addEventListener('change', e => types += e.type);
        i.addEventListener('changeIn', e => types += e.type);
        i.value = 2;
        chai.expect(types).to.equal('changechangeIn');
    });

    it('todo, what should be the value? change from promitive to void object triggers change', () => {
        let i = item(1);
        let changeTriggered = false;
        i.addEventListener('change', e => {
            changeTriggered = true;
        });
        i.value = {};
        chai.expect(changeTriggered).to.equal(true);
    });

    it('ItemEvent.toJSON serializes correctly', () => {
        const i = item({a:2});
        let captured;
        i.addEventListener('changeIn', e => captured = e);
        i.item('a').set(3);
        const json = captured.toJSON();
        chai.expect(json.value).to.equal(3);
        chai.expect(json.path).to.deep.equal(['a']);
    });

    it('ItemEvent.toJSON includes add key on child creation', () => {
        const i = item({});
        let captured;
        i.addEventListener('change', e => { if (e.add) captured = e; });
        i.item('foo');
        const json = captured.toJSON();
        chai.expect(json.add).to.equal('foo');
    });

    it('preventDefault stops $set from being called', () => {
        const i = item(1);
        i.addEventListener('set', e => e.preventDefault());
        i.set(99);
        chai.expect(i.value).to.equal(1);
    });    

});


describe('promise handling', () => {

    it('pending state is true when promise assigned', () => {
        let i = item();
        i.promise = Promise.resolve(42);
        chai.expect(i.pending).to.equal(true);
    });

    it('pending state is false after promise resolves', async () => {
        let i = item();
        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.pending).to.equal(false);
    });

    it('value is set after promise resolves', async () => {
        let i = item();
        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.value).to.equal(42);
    });

    it('error is undefined initially', () => {
        let i = item();
        i.promise = Promise.resolve(42);
        chai.expect(i.error).to.equal(undefined);
    });

    it('error is set when promise rejects', async () => {
        let i = item();
        const testError = new Error('test error');
        i.promise = Promise.reject(testError);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.error).to.equal(testError);
    });

    it('pending is false after promise rejects', async () => {
        let i = item();
        i.promise = Promise.reject(new Error('test'));
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.pending).to.equal(false);
    });

    it('value remains old value after promise rejects', async () => {
        let i = item(100);
        i.promise = Promise.reject(new Error('test'));
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.value).to.equal(100);
    });

    it('change event triggers after promise resolves', async () => {
        let i = item();
        let changeTriggered = false;
        i.addEventListener('change', () => changeTriggered = true);
        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(changeTriggered).to.equal(true);
    });

    it('setting a new promise clears old error', async () => {
        let i = item();
        i.promise = Promise.reject(new Error('first'));
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.error).to.not.equal(undefined);

        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.error).to.equal(undefined);
    });

    it('setting a new promise clears old pending state', async () => {
        let i = item();
        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.pending).to.equal(false);

        i.promise = Promise.reject(new Error('test'));
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.pending).to.equal(false);
    });

    it('race condition: old promise ignored when new promise set', async () => {
        let i = item();
        let resolve1, resolve2;
        const p1 = new Promise(r => resolve1 = r);
        const p2 = new Promise(r => resolve2 = r);

        i.promise = p1;
        i.promise = p2; // überschreibt p1

        resolve1(100); // sollte ignoriert werden
        await new Promise(resolve => setTimeout(resolve, 0));

        resolve2(200);
        await new Promise(resolve => setTimeout(resolve, 0));

        chai.expect(i.value).to.equal(200);
    });

    it('promise resolves to object: only changed properties trigger change', async () => {
        let i = item({ a: 1, b: 2 });
        let changes = [];

        i.item('a').addEventListener('change', e => changes.push('a'));
        i.item('b').addEventListener('change', e => changes.push('b'));

        i.promise = Promise.resolve({ a: 1, b: 3 }); // a bleibt gleich, b ändert sich
        await new Promise(resolve => setTimeout(resolve, 0));

        chai.expect(changes).to.deep.equal(['b']);
    });

    it('promise resolves to object: properties are set correctly', async () => {
        let i = item({ a: 1, b: 2 });
        i.promise = Promise.resolve({ a: 10, b: 20, c: 30 });
        await new Promise(resolve => setTimeout(resolve, 0));

        chai.expect(i.value).to.deep.equal({ a: 10, b: 20, c: 30 });
    });

    it('filled is true after promise resolves', async () => {
        let i = item();
        chai.expect(i.filled).to.equal(false);
        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.filled).to.equal(true);
    });

    it('error is cleared when new promise is set', () => {
        let i = item();
        i.promise = Promise.reject(new Error('first'));
        i.promise = Promise.resolve(42);
        chai.expect(i.error).to.equal(undefined);
    });

    it('error is cleared when promise resolves successfully', async () => {
        let i = item();
        i.promise = Promise.reject(new Error('test'));
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.error).to.not.equal(undefined);

        i.promise = Promise.resolve(42);
        await new Promise(resolve => setTimeout(resolve, 0));
        chai.expect(i.error).to.equal(undefined);
    });

    it('change event contains correct oldValue after promise resolves', async () => {
        let i = item(100);
        let event;
        i.addEventListener('change', e => event = e);

        i.promise = Promise.resolve(200);
        await new Promise(resolve => setTimeout(resolve, 0));

        chai.expect(event.oldValue).to.equal(100);
        chai.expect(event.value).to.equal(200);
    });

    it('todo? change event contains correct oldValue after promise rejects', async () => {
        let i = item(100);
        let event;
        i.addEventListener('change', e => event = e);
        
        i.promise = Promise.reject(new Error('test'));
        await new Promise(resolve => setTimeout(resolve, 0));
        
        chai.expect(event.oldValue).to.equal(100);
        chai.expect(event.value).to.equal(100); // bleibt gleich bei error
    });

});


describe('asyncIteratorFromEventTarget', () => {
    it('is an AsyncGenerator', () => {
        const target = new EventTarget();
        const iterator = asyncIteratorFromEventTarget(target, 'test-event');
        chai.expect(iterator[Symbol.asyncIterator]).to.be.a('function');
        chai.expect(iterator.toString()).to.equal('[object AsyncGenerator]');
    });

    it('yields events added to the queue', async () => {
        const target = new EventTarget();
        const iterator = asyncIteratorFromEventTarget(target, 'test-event');

        // Simulating some events
        setTimeout(() => target.dispatchEvent(new CustomEvent('test-event', { detail: 1 })), 10);
        setTimeout(() => target.dispatchEvent(new CustomEvent('test-event', { detail: 2 })), 20);

        const results = [];
        for await (const event of iterator) {
            results.push(event.detail);
            if (results.length === 2) break;
        }

        chai.expect(results).to.deep.equal([1, 2]);
    });

    it('stops iterating when abort signal is triggered', async () => {
        const target = new EventTarget();
        const abortCtrl = new AbortController();
        const iterator = asyncIteratorFromEventTarget(target, 'test-event', { signal: abortCtrl.signal });

        let yieldedCount = 0;
        let p = (async () => {
            for await (const event of iterator) {
                yieldedCount++;
            }
        })();

        target.dispatchEvent(new Event('test-event'));
        await new Promise(r => setTimeout(r, 10)); // wait for it to be processed

        abortCtrl.abort();

        target.dispatchEvent(new Event('test-event')); // Should not be yielded
        await p;

        chai.expect(yieldedCount).to.equal(1);
    });

    it('does not hang if aborted while waiting', async () => {
        const target = new EventTarget();
        const abortCtrl = new AbortController();
        const iterator = asyncIteratorFromEventTarget(target, 'test-event', { signal: abortCtrl.signal });

        let finished = false;
        let p = (async () => {
            for await (const event of iterator) {
                // do nothing
            }
            finished = true;
        })();

        // Abort right away while it's waiting
        abortCtrl.abort();
        await p;

        chai.expect(finished).to.equal(true);
    });
});

describe('Transparent Data (Object.create(null) storage)', () => {

    it('allows "__proto__" as a normal data key', () => {
        const p = item({}).proxy;
        
        // Wir setzen __proto__ als reinen Datenwert
        p.__proto__ = "I am a string, not a prototype";
        
        // Es muss ein Item zurückgeben (via dein Proxy-Mechanismus)
        chai.expect(p.__proto__[$item]).to.be.ok;
        chai.expect(p.__proto__()).to.equal("I am a string, not a prototype");
        
        // WICHTIG: Die globale Umgebung bleibt sauber
        chai.expect({}.polluted).to.be.undefined;
    });

    it('allows "constructor" as a normal data key', () => {
        const p = item({}).proxy;
        p.constructor = "Not a function";
        
        chai.expect(p.constructor()).to.equal("Not a function");
        // Der echte Constructor des Proxys (für JS-Zwecke) bleibt unberührt,
        // sofern man ihn via Object.getPrototypeOf abfragt.
    });

    it('allows "hasOwnProperty" as a data key', () => {
        const raw = item({});
        const p = raw.proxy;
        
        p.hasOwnProperty = "Just data";
        
        chai.expect(p.hasOwnProperty()).to.equal("Just data");
        chai.expect(raw.has('hasOwnProperty')).to.be.ok;
    });

    it('prevents global prototype pollution even when writing to typical exploit keys', () => {
        const p = item({}).proxy;
        
        // Dieser typische Exploit-Weg darf nur lokale Items erzeugen
        const keys = ['__proto__', 'constructor', 'prototype'];
        
        keys.forEach(key => {
            p[key] = { isSafe: true };
            chai.expect(p[key].isSafe()).to.be.true;
        });

        // Check, dass das globale Object-Prototype nicht verändert wurde
        chai.expect(Object.prototype.isSafe).to.be.undefined;
    });

    it('numeric string keys stay strings and don’t create arrays', () => {
        const raw = item({});
        const p = raw.proxy;
        
        p["10"] = "value";
        
        chai.expect(Array.isArray(raw.value)).to.be.false;
        chai.expect(raw.value["10"]).to.equal("value");
    });
    
    it('JSON.stringify handles reserved keys correctly', () => {
        const p = item({}).proxy;
        p.__proto__ = "test";
        p.constructor = 123;
        
        const json = JSON.stringify(p[$item].value);
        chai.expect(json).to.contain('"__proto__":"test"');
        chai.expect(json).to.contain('"constructor":123');
    });

});


describe('add()', () => {
    it('add() without adder generates a UUID key', async () => {
        const i = item()
        const child = await i.add({ name: 'Hans' })
        chai.expect(child.key).to.match(/^[0-9a-f-]{36}$/)
    })
    it('add() without adder sets value', async () => {
        const i = item()
        const child = await i.add({ name: 'Hans' })
        chai.expect(child.value).to.deep.equal({ name: 'Hans' })
    })
    it('add() child is in parent', async () => {
        const i = item()
        const child = await i.add({ name: 'Hans' })
        chai.expect(i.has(child.key)).to.equal(child)
    })
    it('add() with adder uses returned key', async () => {
        const i = item()
        i.adder = async (value) => ({ key: '42' })
        const child = await i.add({ name: 'Hans' })
        chai.expect(child.key).to.equal('42')
    })
    it('add() with adder does not trigger writer', async () => {
        const i = item()
        let writerCalled = false
        i.adder = async (value) => ({ key: '42' })
        const child = await i.add({ name: 'Hans' })
        child.writer = () => { writerCalled = true }
        child.set({ name: 'Hans' }, { local: true })
        chai.expect(writerCalled).to.equal(false)
    })
    it('add() fires change event on parent', async () => {
        const i = item()
        let added = null
        i.addEventListener('change', e => { if (e.add) added = e.add })
        const child = await i.add({ name: 'Hans' })
        chai.expect(added).to.equal(child)
    })
    it('add() with custom generateKey()', async () => {
        class MyItem extends Item {
            generateKey() { return 'custom-key' }
        }
        const i = new MyItem()
        const child = await i.add({ name: 'Hans' })
        chai.expect(child.key).to.equal('custom-key')
    })
    it('add() throws if adder returns no key', async () => {
        const i = item()
        i.adder = async () => ({})
        try {
            await i.add({ name: 'Hans' })
            chai.expect.fail('should have thrown')
        } catch(e) {
            chai.expect(e.message).to.include('key must be generated')
        }
    })
})

describe('remove({local})', () => {
    it('remove() calls remover', async () => {
        const i = item({ a: 1 })
        let removerCalled = false
        const child = i.item('a')
        child.remover = async () => { removerCalled = true }
        await child.remove()
        chai.expect(removerCalled).to.equal(true)
    })
    it('remove({local:true}) does not call remover', async () => {
        const i = item({ a: 1 })
        let removerCalled = false
        const child = i.item('a')
        child.remover = async () => { removerCalled = true }
        await child.remove({ local: true })
        chai.expect(removerCalled).to.equal(false)
    })
    it('remove() removes item from parent', async () => {
        const i = item({ a: 1 })
        await i.item('a').remove()
        chai.expect(i.has('a')).to.equal(undefined)
    })
    it('remove() fires change event on parent', async () => {
        const i = item({ a: 1 })
        let removed = null
        i.addEventListener('change', e => { if (e.remove) removed = e.remove })
        const child = i.item('a')
        await child.remove()
        chai.expect(removed).to.equal(child)
    })
    it('remove() on root throws', async () => {
        const i = item()
        try {
            await i.remove()
            chai.expect.fail('should have thrown')
        } catch(e) {
            chai.expect(e.message).to.include('cannot remove root')
        }
    })
})

describe('set({local:true})', () => {
    it('set({local:true}) does not trigger writer', () => {
        const i = item()
        let writerCalled = false
        i.writer = () => { writerCalled = true; return Promise.resolve() }
        i.set(42, { local: true })
        chai.expect(writerCalled).to.equal(false)
    })
    it('set({local:true}) still updates value', () => {
        const i = item()
        i.set(42, { local: true })
        chai.expect(i.value).to.equal(42)
    })
    it('set({local:true}) still fires change event', () => {
        const i = item()
        let changed = false
        i.addEventListener('change', () => changed = true)
        i.set(42, { local: true })
        chai.expect(changed).to.equal(true)
    })
    it('set({local:true}) propagates to children', () => {
        const i = item()
        let writerCalled = false
        i.set({ a: 1 }, { local: true })
        i.item('a').writer = () => { writerCalled = true; return Promise.resolve() }
        i.set({ a: 2 }, { local: true })
        chai.expect(writerCalled).to.equal(false)
    })
    it('set() without local triggers writer', async () => {
        const i = item()
        let writerCalled = false
        i.writer = () => { writerCalled = true; return Promise.resolve() }
        i.set(42)
        await new Promise(r => setTimeout(r, 10)) // wait for debounce
        chai.expect(writerCalled).to.equal(true)
    })
})

describe('set({depth:N})', () => {
    it('set({depth:1}) only creates top-level keys, no values', () => {
        const i = item()
        i.set({ a: { b: 1 } }, { depth: 1 })
        chai.expect(i.has('a')).to.be.ok
        chai.expect(i.item('a').filled).to.equal(false)
    })
    it('set({depth:2}) sets values one level deep', () => {
        const i = item()
        i.set({ a: { b: 42 } }, { depth: 2 })
        chai.expect(i.item('a').has('b')).to.be.ok
        chai.expect(i.item('a').item('b').filled).to.equal(false)
    })
    it('set({depth:3}) sets values two levels deep', () => {
        const i = item()
        i.set({ a: { b: 42 } }, { depth: 3 })
        chai.expect(i.item('a').item('b').value).to.equal(42)
    })
    it('set({depth:1}) sets primitive value directly', () => {
        const i = item()
        i.set(42, { depth: 1 })
        chai.expect(i.value).to.equal(42)
    })
})

describe('get({depth:N})', () => {
    it('get({depth:1}) returns null for children', () => {
        const i = item({ a: { b: 42 } })
        const result = i.get({ depth: 1 })
        chai.expect(result.a).to.equal(null)
    })
    it('get({depth:2}) returns first level fully, second level null', () => {
        const i = item({ a: { b: 42 } })
        const result = i.get({ depth: 2 })
        chai.expect(result.a.b).to.equal(null)
    })
    it('get({depth:3}) returns two levels fully', () => {
        const i = item({ a: { b: 42 } })
        const result = i.get({ depth: 3 })
        chai.expect(result.a.b).to.equal(42)
    })
    it('get({depth:1}) is JSON.stringify safe', () => {
        const i = item({ a: { b: 1 }, c: 2 })
        const result = i.get({ depth: 1 })
        chai.expect(JSON.stringify(result)).to.equal('{"a":null,"c":null}')
    })
})
