<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Schema Tests</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="https://unpkg.com/mocha@10.2.0/mocha.css" />
</head>
<body>
    <div id="mocha"></div>

    <script src="https://unpkg.com/chai@4.4.1/chai.js"></script>
    <script src="https://unpkg.com/mocha@10.2.0/mocha.js"></script>

    <script class="mocha-init">
        mocha.setup('bdd');
        mocha.checkLeaks();
    </script>

<script type="module">

import { item } from '../item.js';

const { expect } = chai;

describe('setSchema()', () => {
    it('sets schema on root item', () => {
        const root = item();
        root.setSchema({ type: 'object' });
        expect(root.schema).to.deep.equal({ type: 'object' });
    });

    it('throws when an ancestor already has a schema', () => {
        const root = item();
        root.setSchema({ type: 'object' });
        expect(() => root.item('a').setSchema({ type: 'string' })).to.throw();
    });

    it('throws at any depth', () => {
        const root = item();
        root.setSchema({ type: 'object' });
        expect(() => root.item('a').item('b').item('c').setSchema({ type: 'string' })).to.throw();
    });

    it('allows schema on sibling branches', () => {
        const a = item();
        const b = item();
        a.setSchema({ type: 'string' });
        expect(() => b.setSchema({ type: 'number' })).not.to.throw();
    });
});

describe('schema getter — inheritance', () => {
    it('root.schema returns own schema', () => {
        const root = item();
        root.setSchema({ type: 'object', properties: { name: { type: 'string' } } });
        expect(root.schema.type).to.equal('object');
    });

    it('child inherits schema from parent properties', () => {
        const root = item();
        root.setSchema({ properties: { name: { type: 'string' } } });
        expect(root.item('name').schema).to.deep.equal({ type: 'string' });
    });

    it('returns null for unknown key', () => {
        const root = item();
        root.setSchema({ properties: { name: { type: 'string' } } });
        expect(root.item('unknown').schema).to.equal(null);
    });

    it('returns null when no schema in tree', () => {
        const root = item();
        expect(root.item('a').schema).to.equal(null);
    });

    it('traverses multiple levels deep', () => {
        const root = item();
        root.setSchema({ properties: {
            address: { properties: {
                city: { type: 'string' }
            }}
        }});
        expect(root.item('address').item('city').schema).to.deep.equal({ type: 'string' });
    });
});

describe('additionalProperties', () => {
    it('falls back to additionalProperties for unknown keys', () => {
        const root = item();
        root.setSchema({ additionalProperties: { type: 'number' } });
        expect(root.item('whatever').schema).to.deep.equal({ type: 'number' });
    });

    it('prefers properties over additionalProperties for known keys', () => {
        const root = item();
        root.setSchema({
            properties: { name: { type: 'string' } },
            additionalProperties: { type: 'number' }
        });
        expect(root.item('name').schema).to.deep.equal({ type: 'string' });
        expect(root.item('age').schema).to.deep.equal({ type: 'number' });
    });

    it('inherits nested schema via additionalProperties', () => {
        const root = item();
        root.setSchema({
            additionalProperties: {
                properties: {
                    name: { type: 'string' },
                    age:  { type: 'number' }
                }
            }
        });
        expect(root.item('55').item('name').schema).to.deep.equal({ type: 'string' });
        expect(root.item('2').item('age').schema).to.deep.equal({ type: 'number' });
    });
});



describe('patternProperties', () => {
    it('matches key against pattern', () => {
        const root = item();
        const uuidPattern = '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$';
        root.setSchema({ patternProperties: { [uuidPattern]: { type: 'object' } } });
        expect(root.item('80ab6c46-69d2-4154-8fda-f3967297b714').schema).to.deep.equal({ type: 'object' });
    });

    it('returns null for non-matching key', () => {
        const root = item();
        root.setSchema({ patternProperties: { '^foo': { type: 'string' } } });
        expect(root.item('bar').schema).to.equal(null);
    });

    it('prefers properties over patternProperties', () => {
        const root = item();
        root.setSchema({
            properties: { foo: { type: 'number' } },
            patternProperties: { '^foo': { type: 'string' } }
        });
        expect(root.item('foo').schema).to.deep.equal({ type: 'number' });
    });

    it('prefers patternProperties over additionalProperties', () => {
        const root = item();
        root.setSchema({
            patternProperties: { '^\\d+$': { type: 'integer' } },
            additionalProperties: { type: 'string' }
        });
        expect(root.item('42').schema).to.deep.equal({ type: 'integer' });
        expect(root.item('foo').schema).to.deep.equal({ type: 'string' });
    });
});

describe('items (array-like)', () => {
    it('falls back to items for numeric-like keys', () => {
        const root = item();
        root.setSchema({ items: { type: 'string' } });
        expect(root.item('0').schema).to.deep.equal({ type: 'string' });
        expect(root.item('99').schema).to.deep.equal({ type: 'string' });
    });

    it('prefers items over additionalProperties for numeric keys', () => {
        const root = item();
        root.setSchema({
            items: { type: 'string' },
            additionalProperties: { type: 'number' }
        });
        expect(root.item('0').schema).to.deep.equal({ type: 'string' });
        expect(root.item('foo').schema).to.deep.equal({ type: 'number' });
    });

    it('does not use items for non-numeric keys', () => {
        const root = item();
        root.setSchema({ items: { type: 'string' } });
        expect(root.item('foo').schema).to.equal(null);
        expect(root.item(NaN).schema).to.equal(null);
        expect(root.item(null).schema).to.equal(null);
        expect(root.item('-1').schema).to.equal(null);
        expect(root.item('+1').schema).to.equal(null);
        expect(root.item(+1).schema).to.deep.equal({ type: 'string' });
        expect(root.item('0').schema).to.deep.equal({ type: 'string' });
        expect(root.item('999999999').schema).to.deep.equal({ type: 'string' });
    });
});

describe('get event — listener can override value', () => {
    it('get fires getIn event with composed value', () => {
        const root = item({ a: 1 });
        let eventValue;
        root.addEventListener('getIn', e => {
            if (e.target.key === 'a') eventValue = e.value;
        });
        const val = root.item('a').get();
        expect(eventValue).to.equal(1);
    });

    it('listener can change e.value and it is returned', () => {
        const root = item({ a: 1 });
        root.addEventListener('getIn', e => {
            if (e.value === 1) e.value = 99;
        });
        const val = root.item('a').get();
        expect(val).to.equal(99);
    });

    it('silent option bypasses event', () => {
        const root = item({ a: 1 });
        let fired = false;
        root.addEventListener('getIn', () => { fired = true; });
        const val = root.item('a').get({ silent: true });
        expect(val).to.equal(1);
        expect(fired).to.equal(false);
    });

    it('preventDefault returns undefined', () => {
        const root = item({ a: 1 });
        root.addEventListener('getIn', e => e.preventDefault());
        const val = root.item('a').get();
        expect(val).to.equal(undefined);
    });

    it('circular get throws', () => {
        const root = item({ a: 1 });
        root.addEventListener('getIn', e => {
            if (!e.target.circularGuardTested) {
                e.target.circularGuardTested = true;
                e.target.get(); // circular!
            }
        });
        expect(() => root.item('a').get()).to.throw('circular get');
    });
});

describe('applyDefault — opt-in schema default values', () => {
    it('replaces null with schema.default on getIn', () => {
        const root = item();
        root.setSchema({
            additionalProperties: { default: 42 }
        });
        root.addEventListener('getIn', e => {
            if (e.value == null) {
                const d = e.target.schema?.default;
                if (d !== undefined) e.value = d;
            }
        });
        root.item('x').set(null);
        expect(root.item('x').get()).to.equal(42);
    });

    it('only applies default to null/undefined, not falsy values', () => {
        const root = item();
        root.setSchema({
            additionalProperties: { default: 99 }
        });
        root.addEventListener('getIn', e => {
            if (e.value == null) {
                const d = e.target.schema?.default;
                if (d !== undefined) e.value = d;
            }
        });
        root.item('zero').set(0);
        root.item('false').set(false);
        root.item('empty').set('');
        expect(root.item('zero').get()).to.equal(0);
        expect(root.item('false').get()).to.equal(false);
        expect(root.item('empty').get()).to.equal('');
    });

    it('does not apply default if value is set', () => {
        const root = item();
        root.setSchema({
            additionalProperties: { default: 42 }
        });
        root.addEventListener('getIn', e => {
            if (e.value == null) {
                const d = e.target.schema?.default;
                if (d !== undefined) e.value = d;
            }
        });
        root.item('x').set(7);
        expect(root.item('x').get()).to.equal(7);
    });
});


</script>

<script class="mocha-exec" type="module">
    mocha.run();
</script>
