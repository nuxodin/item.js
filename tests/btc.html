<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <link rel=stylesheet href="https://cdn.jsdelivr.net/gh/u2ui/u2@main/css/classless/simple.css">
<body>


<h1>Bitcoin Wallet Balance Tracker</h1>

<script type=module>

import { effect } from '../item.js';
import { wallets } from "../drivers/btc.js";
import { render, html } from "https://esm.sh/uhtml@4";


const wallet = wallets().proxy;

wallet['bc1q8yj0herd4r4yxszw3nkfvt53433thk0f5qst4g'];
wallet['34xp4vRoCGJym3xR7yCVPFHoCNxv4Twseo'];
wallet['bc1qysj2w7xsw09datsy9mt9x50jn7qjd6qde6d66qm3ce0a4y9uzdpqcavdr0'];


effect(() => {
    render(table, html`
        <thead>
            <tr>
                <th> Wallet
                <th> Value
        <tbody>
            <tr>
                <td> <input id=inp style="width:100%">
                <td> <button onclick="${()=>{wallet[inp.value]; inp.value=''}}">add</button></td>
            </tr>
        ${[...wallet].map(item => {
            return html`
                <tr>
                    <td> ${item}
                    <td align=right><u2-number value="${item.balance()}" digits="8"></u2-number>
            `;
        })}
    `);
});


</script>

<table id=table></table>
