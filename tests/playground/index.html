<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Item.js Playground</title>
    <!--script type=module async src="https://cdn.jsdelivr.net/gh/u2ui/u2@main/u2/auto.js"></script>
    <link rel=stylesheet href="https://cdn.jsdelivr.net/gh/u2ui/u2@main/css/classless/simple.css"-->
    <script type=module src="http://localhost/u2/u2/auto.js"></script>
    <link rel=stylesheet href="http://localhost/u2/css/classless/simple.css">
    <style>
    html { --width: 70rem;}
    </style>

<body>

<script type=module>

// editor:
const editorEl = document.querySelector('#editor');
const editorBinding = reactiveInput(editorEl, {saveOnInput: true, saveOnBlur: false});

// files http:
import { createItemClient as createHttpClient } from "../../tools/httpClient.js";
import { createItemClient as createWsClient } from "../../tools/wsClient.js";

const fs = createHttpClient("http://localhost:3495/files");
const tree = document.getElementById('filesHttp');

window.files = fs; // for testing in console
console.log('write files.item("test.html").value = "hello world" in the console to test');

setTimeout(()=>{
    tree.bindItem(fs);
    fs.loadItems();
    tree.setAttribute('aria-expanded', 'true');
    tree.addEventListener('u2-tree-select', async (event) => {
        const treeEl = event.target;
        const path = treeEl.path().map(el => el.dataset.key).filter(k => k);
        const item = fs.sub(path);
        const value = await item.promise;
        if (typeof value === 'string') {
            editorBinding.setItem(item);
        } else {
            editorEl.value = '';
            item.loadItems();
        }
    });
},300);

// files (websocket):
const fsWs = createWsClient("ws://localhost:3495/ws");
const treeWs = document.getElementById('filesWs');
setTimeout(()=>{
    treeWs.bindItem(fsWs);
    fsWs.loadItems();
    treeWs.setAttribute('aria-expanded', 'true');
    treeWs.addEventListener('u2-tree-select', async (event) => {
        const treeEl = event.target;
        const path = treeEl.path().map(el => el.dataset.key).filter(k => k);
        const item = fsWs.sub(path);
        const value = await item.promise;
        if (typeof value === 'string') {
            editorBinding.setItem(item);
        } else {
            editorBinding.setItem();
            item.loadItems();
        }
    });
},300)


import {jsonDataItem} from '../../tools/jsonDataItem.js';

customElements.whenDefined('u2-tree').then(async ()=>{
    const tree = document.getElementById('demoJsonTree');
    const demoJson = await jsonDataItem(fsWs.item('demo.json'));
    tree.bindItem(demoJson);
});


function reactiveInput(element, options = {}) {
    options = {
        saveOnInput: false,
        saveOnBlur: true,
        ...options
    };
    let currentReactiveItem = null;
    let inputBlocked = false;

    function save() {
        if (!currentReactiveItem) return;
        currentReactiveItem.set(element.value).then(() => {

        }).catch(error => {
            console.error('Error saving item:', error);
            alert('Error saving item.');
        });
    }

    const onItemChange = () => {
        if (!inputBlocked) {
            element.value = currentReactiveItem?.value || '';
        } else {
            console.warn('Item changed while input is focused. Consider implementing a notification mechanism.');
        }
    };

    const setItem = async (nextItem) => {
        currentReactiveItem?.removeEventListener('change', onItemChange);
        currentReactiveItem = nextItem;
        element.value = '';
        if (!currentReactiveItem) return;
        element.value = 'loading...';
        element.value = await currentReactiveItem.promise;
        currentReactiveItem?.addEventListener('change', onItemChange);
    };

    element.addEventListener('focus', () => inputBlocked = true);
    element.addEventListener('keydown', async (e) => {
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            save();
        }
    });
    element.addEventListener('blur', async () => {
        inputBlocked = false;
        if (options.saveOnBlur) {
            save();
        } else {
            console.warn('Input blurred but saveOnBlur is false. Consider implementing a notification mechanism.');
        }
    });
    element.addEventListener('input', () => {
        if (options.saveOnInput) {
            if (!currentReactiveItem) return;
            save(); // todo: debounce this
        } else {
            console.warn('Input changed but saveOnInput is false. Consider implementing a notification mechanism.');
        }
    });
    return { setItem };
};



</script>

<main>
    <u2-tabs>
        <h2>Files</h2>
        <div>
            <u2-splitpanel style="height:40rem">
                <div style="flex: 0 1 auto;">
                    <h3>http</h3>
                    <u2-tree id="filesHttp">Loading...</u2-tree>
                    <h3>websockets</h3>
                    <u2-tree id="filesWs">Loading...</u2-tree>
                    <h3>demo.json</h3>
                    <u2-tree id="demoJsonTree">Loading...</u2-tree>
                </div>
                <u2-code id="editor" editable></u2-code>
            </u2-splitpanel>
        </div>

        <h2>Console</h2>
        <div>
            <u2-splitpanel style="height:20rem" vertical>
                <u2-splitpanel style="height:20rem">
                    <u2-code id="consoleInput" editable trim>
                        i.item("test").value = "hello world"
                    </u2-code>
                    <u2-code id="consoleInspect"></u2-code>
                </u2-splitpanel>
                <u2-splitpanel style="height:10rem">
                    <u2-code id="consoleReturn"></u2-code>
                    <u2-code id="consoleLog"></u2-code>
                </u2-splitpanel>
            </u2-splitpanel>
            <script type="module">
                import { item, effect } from "../../item.js";
                customElements.whenDefined('u2-code').then(() => {
                    const root = item();
                    window.i = root;   // wichtig für eval im Modul
                    window.log = (...args)=>{
                        consoleLog.value += Array.from(args).join() + '\n';
                    }
                    consoleInput.addEventListener("input", () => {
                        consoleLog.value = '';
                        consoleReturn.value = '';
                        const code = consoleInput.value.trim();
                        try {
                            i.value = undefined;
                            const r = eval(code);
                            consoleReturn.style.color = '';
                            console.log('return', r);
                            //consoleReturn.value = JSON.stringify(r.value, null, 2);
                        } catch (err) {
                            console.log('error from eval', err);
                            consoleReturn.style.color = 'red';
                            consoleReturn.value = "Error: " + err.message;
                        }
                    });
                    effect(() => {
                        console.log(root.value)
                        consoleInspect.value = JSON.stringify(root.value, null, 2);
                    });
                });
            </script>
        </div>

        <h2>Cookies</h2>
        <div>
            <u2-tree id="cookiesTree" aria-expanded="true"></u2-tree>
            <script type=module>
                import { cookies } from "../../drivers/cookies.js";
                const cookiesTree = document.getElementById('cookiesTree');
                setTimeout(() => {
                    const cooks = cookies();
                    cookiesTree.bindItem(cooks);
                    cooks.loadItems({ url: location.href });
                }, 500);
            </script>
        </div>

        <h2>About</h2>
        <div style="padding: 20px;">
            <h3>Item.js Playground</h3>
            <p>Test environment for Item.js HTTP system.</p>
            <h4>Start:</h4>
            <code>deno run -A server.js</code>
            <h4>Features:</h4>
            <ul>
                <li>Browse real filesystem</li>
                <li>Edit files</li>
                <li>Save changes</li>
            </ul>
        </div>
    </u2-tabs>
</main>
